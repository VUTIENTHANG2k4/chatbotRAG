services:
  ollama:
    image: ollama/ollama:latest
    container_name: legal-rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-rag-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - LLM_PROVIDER=ollama
      # - GEMINI_MODEL=gemini-2.0-flash-lite
      # - GOOGLE_API_KEY=your_key_here
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBED_PROVIDER=huggingface
      - HF_EMBED_MODEL=${HF_EMBED_MODEL:-keepitreal/vietnamese-sbert}
      - HF_DEVICE=cpu
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:3000"]
    volumes:
      - ./backend/data:/app/data
      - backend_storage:/app/storage
      - hf_cache:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-rag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # BACKEND_URL: server-only var, read at runtime by next.config.mjs rewrites
      # (unlike NEXT_PUBLIC_* which are baked at build time)
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  ollama_data:
  backend_storage:
  hf_cache:
